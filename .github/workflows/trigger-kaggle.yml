name: Kaggle Auto Runner

on:
  repository_dispatch:
    types: [trigger-kaggle]
  workflow_dispatch:

concurrency:
  group: kaggle-push
  cancel-in-progress: false

jobs:
  push-to-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify Kaggle Works
        run: python -c "from kaggle.api.kaggle_api_extended import KaggleApi; print('OK')"

      - name: Setup Kaggle Auth
        run: |
          mkdir -p ~/.kaggle
          python3 -c "
          import json, os
          with open(os.path.expanduser('~/.kaggle/kaggle.json'), 'w') as f:
              json.dump({'username': os.environ['U'], 'key': os.environ['K']}, f)
          os.chmod(os.path.expanduser('~/.kaggle/kaggle.json'), 0o600)
          "
        env:
          U: ${{ secrets.KAGGLE_USERNAME }}
          K: ${{ secrets.KAGGLE_KEY }}

      - name: Update Kernel Metadata
        run: |
          python3 -c "
          import json, os
          with open('kernel/kernel-metadata.json') as f:
              m = json.load(f)
          m['id'] = os.environ['U'] + '/' + os.environ['N']
          with open('kernel/kernel-metadata.json', 'w') as f:
              json.dump(m, f, indent=2)
          "
        env:
          U: ${{ secrets.KAGGLE_USERNAME }}
          N: ${{ secrets.KERNEL_NAME }}

      - name: Push Kernel
        run: kaggle kernels push -p ./kernel

      - name: Check Status
        run: |
          sleep 15
          kaggle kernels status ${{ secrets.KAGGLE_USERNAME }}/${{ secrets.KERNEL_NAME }}
